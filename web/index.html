<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RCK İş Takibi — Görüntüleme</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/viewer.css" />
</head>
<body>
  <div id="app" class="app">
    <section id="pin-screen" class="pin-screen">
      <div class="pin-card">
        <h1>RCK İş Takibi</h1>
        <p class="muted">Salt okunur görüntüleme</p>
        <label class="field">
          <span>PIN</span>
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN girin" />
        </label>
        <button id="pin-submit" type="button" class="btn primary">Giriş</button>
        <p id="pin-error" class="error" hidden></p>
      </div>
    </section>

    <section id="main-screen" class="main-screen" hidden>
      <header class="top-bar">
        <div>
          <h1>RCK İş Takibi</h1>
          <p id="last-updated" class="muted">Son güncelleme: —</p>
        </div>
        <button id="refresh-btn" type="button" class="btn ghost">Yenile</button>
      </header>

      <div class="search-bar">
        <input id="global-search" type="search" placeholder="Ara (ada/parsel, metin…)" />
      </div>

      <nav class="tab-bar" id="tab-bar" aria-label="Modüller"></nav>
      <main id="content" class="content" aria-live="polite"></main>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/modules/acil.js"></script>
  <script src="js/modules/proje-onay.js"></script>
  <script src="js/modules/personel.js"></script>
  <script src="js/modules/karot.js"></script>
  <script src="js/modules/tadilat.js"></script>
  <script src="js/modules/yibf-is-takibi.js"></script>
  <script src="js/modules/tum-eksikler.js"></script>
  <script src="js/modules/arama.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
