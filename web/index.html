<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RCK İş Takibi — Görüntüleme</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/viewer.css?v=20260828c" />
  <script>
    window.WEB_VIEWER_CONFIG = {
      webPin: "271179",
      dataUrl: "/rck-is-takibi-web/export/web-view-latest.json"
    };
  </script>
</head>
<body>
  <div id="app" class="app">
    <section id="pin-screen" class="pin-screen">
      <div class="pin-card">
        <h1>RCK İş Takibi</h1>
        <p class="muted">Salt okunur görüntüleme — PIN girin</p>
        <label class="field">
          <span>PIN</span>
          <input id="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="6 haneli PIN" maxlength="12" />
        </label>
        <button id="pin-submit" type="button" class="btn primary">Giriş</button>
        <p id="pin-error" class="error" hidden></p>
      </div>
    </section>

    <section id="main-screen" class="main-screen" hidden>
      <header class="top-bar">
        <div>
          <h1>RCK İş Takibi</h1>
          <p id="last-updated" class="muted">Son güncelleme: —</p>
        </div>
        <button id="refresh-btn" type="button" class="btn ghost">Yenile</button>
      </header>

      <div class="search-bar">
        <input id="global-search" type="search" placeholder="Ara (ada/parsel, metin…)" />
      </div>

      <nav class="tab-bar" id="tab-bar" aria-label="Modüller"></nav>
      <main id="content" class="content" aria-live="polite"></main>
    </section>
  </div>

  <script src="js/parser.js?v=20260828c"></script>
  <script src="js/modules/acil.js?v=20260828c"></script>
  <script src="js/modules/proje-onay.js?v=20260828c"></script>
  <script src="js/modules/personel.js?v=20260828c"></script>
  <script src="js/modules/karot.js?v=20260828c"></script>
  <script src="js/modules/tadilat.js?v=20260828c"></script>
  <script src="js/modules/yibf-is-takibi.js?v=20260828c"></script>
  <script src="js/modules/tum-eksikler.js?v=20260828c"></script>
  <script src="js/modules/arama.js?v=20260828c"></script>
  <script src="js/app.js?v=20260828c"></script>
</body>
</html>
